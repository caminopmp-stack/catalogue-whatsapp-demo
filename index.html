<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maison Zahra — Catalogue WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="card">

    <header class="header">
      <div class="header-top">
        <div class="header-left">
          <img class="logo-placeholder" src="logo-maison-zahra.jpg" alt="Logo Maison Zahra">
          <div>
            <div class="shop-name" id="shopName"></div>
            <div class="tagline" id="tagline"></div>
          </div>
        </div>
        <a class="instagram-link" id="instagramLink" href="#" target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B2320" stroke-width="1.7">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.2" cy="6.8" r="1.1" fill="#2B2320" stroke="none"></circle>
          </svg>
        </a>
      </div>
      <div class="delivery-line">Livraison 58 wilayas · Paiement à la livraison</div>
    </header>

    <div class="search-filter-block">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A8873" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="M16 16l4.5 4.5"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="Rechercher un produit" aria-label="Rechercher un produit">
        <button type="button" id="clearSearch" class="clear-search-btn" aria-label="Effacer la recherche" hidden>×</button>
      </div>
      <div class="filter-row">
        <select id="sortSelect" aria-label="Trier par prix">
          <option value="default">Tri par défaut</option>
          <option value="asc">Prix croissant</option>
          <option value="desc">Prix décroissant</option>
        </select>
        <select id="rangeSelect" aria-label="Filtrer par gamme de prix">
          <option value="all">Tous les prix</option>
          <option value="lt3">Moins de 3 000 DA</option>
          <option value="mid">3 000 – 6 000 DA</option>
          <option value="gt6">Plus de 6 000 DA</option>
        </select>
      </div>
    </div>

    <nav class="categories" id="categories"></nav>

    <div class="product-grid" id="productGrid"></div>

    <div class="no-results" id="noResults" hidden>Aucun produit ne correspond à cette recherche.</div>

    <div class="fallback-section">
      <button type="button" class="fallback-toggle" id="fallbackToggle">Pas de WhatsApp ?</button>
      <div class="fallback-box" id="fallbackBox" hidden>
        <div class="fallback-hint">Collez ce message dans Instagram ou votre messagerie.</div>
        <textarea id="fallbackMessage" readonly rows="9"></textarea>
        <button type="button" id="copyMessageBtn" class="copy-btn">Copier le message</button>
      </div>
    </div>

    <div class="cart-sheet" id="cartSheet" hidden>
      <div class="cart-sheet-header">
        <div class="cart-sheet-title">Ma sélection</div>
        <button type="button" id="closeCart" class="cart-close" aria-label="Fermer">×</button>
      </div>
      <div class="cart-empty" id="cartEmpty">Aucun produit sélectionné pour le moment.</div>
      <div id="cartLines"></div>
      <div class="cart-total-row">
        <div class="cart-total-label">Total</div>
        <div class="cart-total-value" id="cartTotal">0 DA</div>
      </div>

      <div class="cart-contact">
        <div class="cart-contact-label">Vos coordonnées</div>
        <input type="text" id="nomInput" class="contact-input" placeholder="Nom et prénom *" aria-label="Nom et prénom">
        <select id="wilayaSelect" class="contact-input" aria-label="Wilaya">
          <option value="">Wilaya *</option>
        </select>
        <input type="tel" id="telInput" class="contact-input" placeholder="Téléphone (optionnel)" aria-label="Téléphone">
      </div>
    </div>

    <button type="button" class="cart-fab" id="cartFab" aria-label="Voir ma sélection">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4EADC" stroke-width="1.6">
        <path d="M6 8h12l-1.2 11H7.2L6 8Z"></path>
        <path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path>
      </svg>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>

    <div class="send-bar">
      <div class="send-note" id="sendNote" hidden></div>
      <a href="#" target="_blank" rel="noopener" class="send-btn" id="sendBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2.4a9.6 9.6 0 0 0-8.2 14.6L2.4 21.6l4.7-1.3A9.6 9.6 0 1 0 12 2.4Zm5.3 13.3c-.2.6-1.3 1.2-1.9 1.2-1.6 0-4-1-5.7-2.7C8 12.5 7 10.4 7 9.1c0-.7.5-1.7 1.1-2 .3-.1.6-.1.8.1l1 1.6c.1.3.1.5-.1.7l-.5.6c-.2.2-.2.4-.1.6.4.8 1.7 2.1 2.6 2.5.2.1.4 0 .6-.1l.6-.6c.2-.2.4-.2.7-.1l1.6 1c.2.2.3.5.1.8Z"></path>
        </svg>
        <span>Envoyer ma commande sur WhatsApp</span>
      </a>
    </div>

  </div>
</div>
<script src="script.js"></script>
</body>
</html>
